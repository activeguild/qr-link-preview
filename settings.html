<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Link Preview 設定</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
        }
        .setting-group {
            margin-bottom: 20px;
        }
        .setting-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .size-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .size-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .size-option input[type="radio"] {
            margin: 0;
        }
        .save-status {
            color: green;
            font-size: 14px;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .save-status.show {
            opacity: 1;
        }
        .stock-item {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 8px;
            background: #f9f9f9;
        }
        .stock-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .stock-name {
            font-weight: bold;
            color: #333;
            flex: 1;
        }
        .stock-date {
            font-size: 12px;
            color: #666;
            margin-left: 8px;
        }
        .stock-url {
            font-size: 12px;
            color: #007cba;
            word-break: break-all;
            margin-bottom: 8px;
        }
        .stock-actions {
            display: flex;
            gap: 4px;
        }
        .stock-btn {
            padding: 4px 8px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
        }
        .stock-btn-download {
            background: #007cba;
            color: white;
        }
        .stock-btn-download:hover {
            background: #005a87;
        }
        .stock-btn-rename {
            background: #ffc107;
            color: #212529;
        }
        .stock-btn-rename:hover {
            background: #e0a800;
        }
        .stock-btn-delete {
            background: #dc3545;
            color: white;
        }
        .stock-btn-delete:hover {
            background: #c82333;
        }
        .stock-rename-input {
            width: 100%;
            padding: 4px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 12px;
            box-sizing: border-box;
        }
        #qr-stocks-empty {
            color: #666;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>QR Link Preview 設定</h1>
    
    <div class="setting-group">
        <label>QRコードサイズ:</label>
        <div class="size-options">
            <div class="size-option">
                <input type="radio" id="size-small" name="qrSize" value="128">
                <label for="size-small">小 (128px × 128px)</label>
            </div>
            <div class="size-option">
                <input type="radio" id="size-medium" name="qrSize" value="192">
                <label for="size-medium">中 (192px × 192px)</label>
            </div>
            <div class="size-option">
                <input type="radio" id="size-large" name="qrSize" value="256">
                <label for="size-large">大 (256px × 256px)</label>
            </div>
        </div>
    </div>

    <div class="setting-group">
        <label>ストック済みQRコード:</label>
        <div id="qr-stocks-container">
            <div id="qr-stocks-list"></div>
            <div id="qr-stocks-empty" style="display: none;">
                ストック済みのQRコードはありません
            </div>
        </div>
    </div>

    <div class="save-status" id="saveStatus">設定を保存しました</div>

    <script src="settings.js"></script>
</body>
</html>
